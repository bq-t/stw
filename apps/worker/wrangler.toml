name = "stw-vbucks-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Every 15 minutes. A run exits right away once today's snapshot is saved,
# so this costs one KV read per run and survives late rotations on Epic's side.
[triggers]
crons = ["*/15 * * * *"]

# Created with: pnpm wrangler kv namespace create MISSIONS
[[kv_namespaces]]
binding = "MISSIONS"
id = "528b8f2463174fb78f3ed6e68163f45d"

[vars]
# Comma-separated origins allowed by CORS. localhost is always allowed.
ALLOWED_ORIGINS = "https://stw.bq-t.pro,https://stw-vbucks.pages.dev"
# Links and images in the Discord message. Switch to https://stw.bq-t.pro once the custom domain is attached.
SITE_URL = "https://stw-vbucks.pages.dev"
# Optional custom server emoji next to V-Bucks amounts in Discord, e.g. "<:vbucks:123456789012345678>".
# DISCORD_VBUCKS_EMOJI = ""

[observability]
enabled = true

# Secrets (wrangler secret put <NAME>), see .dev.vars.example:
# EPIC_CLIENT, EPIC_ACCOUNT_ID, EPIC_DEVICE_ID, EPIC_DEVICE_SECRET, DISCORD_WEBHOOK_URL (optional)

name = "stw-vbucks-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The site's own domain serves the API too, so the login cookie is first-party.
# workers.dev keeps working for the old NEXT_PUBLIC_API_URL.
routes = [{ pattern = "stw.bq-t.pro/api/*", zone_name = "bq-t.pro" }]
workers_dev = true

# Every 5 minutes: the Epic status for the bot's boards (one D1 write per run), and the
# day's snapshot, which exits after one KV read once saved (survives late rotations).
[triggers]
crons = ["*/5 * * * *"]

# Created with: pnpm wrangler kv namespace create MISSIONS
[[kv_namespaces]]
binding = "MISSIONS"
id = "528b8f2463174fb78f3ed6e68163f45d"

# Created with: pnpm wrangler d1 create stw. Schema: migrations/ (pnpm db:migrate / db:migrate:local).
[[d1_databases]]
binding = "DB"
database_name = "stw"
database_id = "9f237570-1658-406b-8800-d28033d2f6c6"
migrations_dir = "migrations"

[vars]
# Comma-separated origins allowed by CORS. localhost is always allowed.
ALLOWED_ORIGINS = "https://stw.bq-t.pro,https://stw-vbucks.pages.dev"
# Links and images in the Discord message.
SITE_URL = "https://stw.bq-t.pro"
# Discord application "Fishstick" (login on the site, later the bot). Empty → login is off.
DISCORD_CLIENT_ID = "1569345926382755981"
# Bot: checks the signature of /api/discord/interactions. Empty → the bot endpoint is off.
DISCORD_PUBLIC_KEY = "6b9b9005bb63e547ebf0f9229717881576a83f9e62db928fc5b86def271aaefb"

[observability]
enabled = true

# Secrets (wrangler secret put <NAME>), see .dev.vars.example:
# EPIC_CLIENT, EPIC_ACCOUNT_ID, EPIC_DEVICE_ID, EPIC_DEVICE_SECRET, DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN
